<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Laksh &lt;3!!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96f;
    --cream: #f5ede0;
    --dark: #0a0806;
    --text: #f0e6d3;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'DM Mono', monospace;
    background: var(--dark);
    color: var(--text);
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    position: fixed;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid var(--gold-light);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, opacity 0.3s;
    opacity: 0.5;
  }
  .cursor.hover      { width: 20px; height: 20px; }
  .cursor-ring.hover { width: 60px; height: 60px; opacity: 0.2; }

  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    filter: saturate(0.6) brightness(0.5);
    transition: opacity 1.5s ease;
  }
  #bg-video.visible { opacity: 0.35; }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.5;
    mix-blend-mode: overlay;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }

  #enter-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.9s ease;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }

  #enter-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: none;
    border: none;
    cursor: none;
    transition: transform 0.3s ease;
  }
  #enter-btn:hover { transform: scale(1.04); }

  .enter-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    overflow: hidden;
    background: #1a1208;
    box-shadow: 0 0 0 2px var(--gold);
  }
  .enter-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .enter-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .enter-cta {
    padding: 9px 28px;
    background: var(--gold);
    color: #0a0806;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  #enter-btn:hover .enter-cta { background: var(--gold-light); }

  .enter-dots { display: flex; gap: 5px; }
  .enter-dots span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    animation: blink 1.4s ease-in-out infinite;
  }
  .enter-dots span:nth-child(2) { animation-delay: 0.2s; }
  .enter-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%       { opacity: 1; }
  }

  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px 80px;
  }

  .profile {
    text-align: center;
    margin-bottom: 44px;
    animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), transparent, var(--gold-light), transparent, var(--gold));
    animation: spin 6s linear infinite;
    z-index: -1;
  }
  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a1f10, #1a1208);
    border: 2px solid var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    position: relative;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-emoji { line-height: 1; }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--cream), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    animation: neonFlicker 4s infinite;
  }

  @keyframes neonFlicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.4; }
  }

  .bio {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: rgba(240,230,211,0.55);
    text-transform: uppercase;
    max-width: 340px;
    margin: 0 auto;
    line-height: 1.8;
  }

  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 28px auto;
    animation: fadeUp 1s 0.2s both;
  }

  /* ── LINKS ── */
  .links {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px 12px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1),
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.7s both;
  }

  /* shimmer sweep on hover */
  .link-item::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    transform: skewX(-15deg);
    transition: left 0.45s ease;
    pointer-events: none;
  }
  .link-item:hover::after { left: 160%; }

  .link-item:hover {
    transform: translateY(-3px) scale(1.018);
    background: var(--c-bg, rgba(255,255,255,0.06));
    border-color: var(--c-border, rgba(255,255,255,0.2));
    box-shadow: 0 0 0 1px var(--c-ring, transparent),
                0 14px 40px -8px var(--c-glow, rgba(0,0,0,0.5)),
                0 4px 10px rgba(0,0,0,0.35);
  }
  .link-item:active { transform: translateY(-1px) scale(1.006); }

  .link-icon {
    width: 48px; height: 48px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
    background: var(--c-icon, rgba(255,255,255,0.08));
    border: 1px solid var(--c-icon-border, rgba(255,255,255,0.1));
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    z-index: 1;
  }
  .link-item:hover .link-icon { transform: scale(1.14) rotate(-5deg); }

  .link-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .link-title {
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #fff;
  }
  .link-sub {
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.69rem;
    letter-spacing: 0.01em;
    color: rgba(255,255,255,0.38);
    margin-top: 2px;
  }

  .link-arrow {
    color: var(--c-arrow, rgba(255,255,255,0.3));
    opacity: 0;
    transform: translateX(-6px);
    transition: all 0.25s ease;
    font-size: 15px;
    position: relative;
    z-index: 1;
    background: var(--c-icon, rgba(255,255,255,0.08));
    border: 1px solid var(--c-icon-border, rgba(255,255,255,0.1));
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .link-item:hover .link-arrow { opacity: 1; transform: translateX(0); }

  /* Per-platform palettes */
  .link-item[data-p="youtube"] {
    --c-icon: rgba(255,50,50,0.22);
    --c-icon-border: rgba(255,80,80,0.3);
    --c-bg: rgba(255,40,40,0.07);
    --c-border: rgba(255,60,60,0.35);
    --c-ring: rgba(255,50,50,0.2);
    --c-glow: rgba(255,40,40,0.4);
    --c-arrow: rgba(255,100,100,0.9);
  }
  .link-item[data-p="twitch"] {
    --c-icon: rgba(145,70,255,0.22);
    --c-icon-border: rgba(160,90,255,0.3);
    --c-bg: rgba(140,65,255,0.07);
    --c-border: rgba(145,70,255,0.35);
    --c-ring: rgba(145,70,255,0.2);
    --c-glow: rgba(130,60,255,0.4);
    --c-arrow: rgba(175,120,255,0.9);
  }
  .link-item[data-p="instagram"] {
    --c-icon: rgba(230,75,160,0.22);
    --c-icon-border: rgba(240,100,175,0.3);
    --c-bg: rgba(220,70,150,0.07);
    --c-border: rgba(230,80,165,0.35);
    --c-ring: rgba(230,80,165,0.2);
    --c-glow: rgba(215,65,145,0.4);
    --c-arrow: rgba(245,130,200,0.9);
  }
  .link-item[data-p="steam"] {
    --c-icon: rgba(90,150,255,0.22);
    --c-icon-border: rgba(110,165,255,0.3);
    --c-bg: rgba(80,140,255,0.07);
    --c-border: rgba(90,155,255,0.35);
    --c-ring: rgba(90,150,255,0.2);
    --c-glow: rgba(75,135,255,0.4);
    --c-arrow: rgba(140,185,255,0.9);
  }
  .link-item[data-p="roblox"] {
    --c-icon: rgba(220,45,45,0.22);
    --c-icon-border: rgba(235,70,70,0.3);
    --c-bg: rgba(210,40,40,0.07);
    --c-border: rgba(220,55,55,0.35);
    --c-ring: rgba(220,45,45,0.2);
    --c-glow: rgba(205,35,35,0.4);
    --c-arrow: rgba(250,110,110,0.9);
  }
  .link-item[data-p="snapchat"] {
    --c-icon: rgba(250,220,0,0.2);
    --c-icon-border: rgba(255,235,0,0.28);
    --c-bg: rgba(240,210,0,0.06);
    --c-border: rgba(250,225,0,0.35);
    --c-ring: rgba(250,225,0,0.18);
    --c-glow: rgba(235,205,0,0.35);
    --c-arrow: rgba(255,240,80,0.9);
  }
  .link-item[data-p="spotify"] {
    --c-icon: rgba(30,215,96,0.2);
    --c-icon-border: rgba(45,225,105,0.28);
    --c-bg: rgba(25,205,88,0.06);
    --c-border: rgba(30,215,96,0.32);
    --c-ring: rgba(30,215,96,0.18);
    --c-glow: rgba(20,195,80,0.38);
    --c-arrow: rgba(80,235,140,0.9);
  }

  .link-item:nth-child(1) { animation-delay: 0.10s; }
  .link-item:nth-child(2) { animation-delay: 0.17s; }
  .link-item:nth-child(3) { animation-delay: 0.24s; }
  .link-item:nth-child(4) { animation-delay: 0.31s; }
  .link-item:nth-child(5) { animation-delay: 0.38s; }
  .link-item:nth-child(6) { animation-delay: 0.45s; }
  .link-item:nth-child(7) { animation-delay: 0.52s; }
  .link-item:nth-child(8) { animation-delay: 0.59s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .page { padding: 40px 16px 60px; }
    .links { max-width: 100%; }
  }
  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none; }
    #enter-overlay { cursor: pointer; }
    #enter-btn { cursor: pointer; }
  }
</style>
</head>
<body>

<div id="enter-overlay">
  <button id="enter-btn" aria-label="Enter site">
    <div class="enter-avatar">
      <img src="mygif.gif" alt="Laksh" onerror="this.style.display='none'"/>
    </div>
    <div class="enter-name">Laksh &lt;3!!</div>
    <div class="enter-cta">Enter ↗</div>
  </button>
  <div class="enter-dots"><span></span><span></span><span></span></div>
</div>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<video id="bg-video" loop playsinline webkit-playsinline src="bg.mp4"></video>
<div class="grain"></div>
<div class="vignette"></div>

<main class="page">
  <div class="profile">
    <div class="avatar-wrap">
      <div class="avatar" id="avatarEl"><span class="avatar-emoji">✦</span></div>
    </div>
    <h1 class="name" id="userName">Laksh &lt;3!!</h1>
    <p class="bio" id="userBio">18 | Game Developer | Content Creator | Discord Moderation | Gamer</p>
  </div>
  <div class="divider"></div>
  <div class="links" id="linksContainer"></div>
</main>

<script>
const CONFIG = {
  name:        "Laksh <3!!",
  bio:         "18 | Game Developer | Content Creator | Discord Moderation | Gamer",
  avatarEmoji: "✦",
  avatarImg:   "mygif.gif",
  links: [
    { icon: "▶",  platform: "youtube",   title: "YouTube",   sub: "@laksh",          url: "https://www.youtube.com/channel/UCYmXwWSLJvguHhP-nFo69Jg" },
    { icon: "🎮", platform: "twitch",    title: "Twitch",    sub: "lakshxplayz",     url: "https://www.twitch.tv/lakshxplayz" },
    { icon: "📸", platform: "instagram", title: "Instagram", sub: "@lakshx.jpeg",    url: "https://www.instagram.com/lakshx.jpeg" },
    { icon: "📸", platform: "instagram", title: "Instagram", sub: "@lakshx.playz",   url: "https://www.instagram.com/lakshx.playz" },
    { icon: "🎮", platform: "steam",     title: "Steam",     sub: "lakshx",          url: "https://steamcommunity.com/id/lakshx" },
    { icon: "🎮", platform: "roblox",    title: "Roblox",    sub: "lakshx",          url: "https://www.roblox.com/users/5496495013/profile" },
    { icon: "👻", platform: "snapchat",  title: "Snapchat",  sub: "@lakshx.jpeg",    url: "https://www.snapchat.com/@lakshx.jpeg" },
    { icon: "🎵", platform: "spotify",   title: "Spotify",   sub: "lakshx",          url: "https://open.spotify.com/user/314rymteiostne2wjommzch2gmvm" },
  ]
};

document.getElementById('userName').textContent = CONFIG.name;
document.getElementById('userBio').textContent  = CONFIG.bio;
document.title = CONFIG.name + " | Links";

const avatarEl = document.getElementById('avatarEl');
if (CONFIG.avatarImg) {
  const img = document.createElement('img');
  img.src = CONFIG.avatarImg; img.alt = CONFIG.name;
  img.onerror = () => { avatarEl.innerHTML = `<span class="avatar-emoji">${CONFIG.avatarEmoji}</span>`; };
  avatarEl.innerHTML = ''; avatarEl.appendChild(img);
}

const fragment = document.createDocumentFragment();
CONFIG.links.forEach(link => {
  const a = document.createElement('a');
  a.href = link.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.className = 'link-item';
  a.dataset.p = link.platform;
  a.innerHTML = `
    <div class="link-icon">${link.icon}</div>
    <div class="link-info">
      <div class="link-title">${link.title}</div>
      <div class="link-sub">${link.sub}</div>
    </div>
    <div class="link-arrow">→</div>
  `;
  fragment.appendChild(a);
});
document.getElementById('linksContainer').appendChild(fragment);

const overlay = document.getElementById('enter-overlay');
const enterBtn = document.getElementById('enter-btn');
const video = document.getElementById('bg-video');

function startExperience() {
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play(); });
  overlay.classList.add('fade-out');
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}
enterBtn.addEventListener('click', startExperience, { once: true });
enterBtn.addEventListener('touchend', e => { e.preventDefault(); startExperience(); }, { once: true });

const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = -100, my = -100, rx = -100, ry = -100, cursorRaf;

function moveCursor() {
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  cursorRaf = requestAnimationFrame(moveCursor);
}
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
cursorRaf = requestAnimationFrame(moveCursor);

document.addEventListener('mouseover', e => {
  if (e.target.closest('a, button')) { cursor.classList.add('hover'); ring.classList.add('hover'); }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('a, button')) { cursor.classList.remove('hover'); ring.classList.remove('hover'); }
});
document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; ring.style.opacity = '0'; });
document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; ring.style.opacity = ''; });

video.addEventListener('canplay', () => video.classList.add('visible'), { once: true });

const canvas = document.createElement('canvas');
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d', { alpha: true });
let cw = canvas.width = window.innerWidth;
let ch = canvas.height = window.innerHeight;

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }, 150);
});

const flakes = Array.from({ length: 80 }, () => ({
  x: Math.random() * cw, y: Math.random() * ch,
  r: Math.random() * 3 + 1,
  speed: Math.random() * 1.2 + 0.4,
  wind: Math.random() * 0.6 - 0.3,
  opacity: Math.random() * 0.6 + 0.3,
}));

let snowRaf, paused = false;

function drawSnow() {
  if (paused) return;
  ctx.clearRect(0, 0, cw, ch);
  for (let i = 0; i < flakes.length; i++) {
    const f = flakes[i];
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${f.opacity})`; ctx.fill();
    f.y += f.speed; f.x += f.wind;
    if (f.y > ch) { f.y = -f.r; f.x = Math.random() * cw; }
    if (f.x > cw) f.x = 0;
    if (f.x < 0)  f.x = cw;
  }
  snowRaf = requestAnimationFrame(drawSnow);
}
snowRaf = requestAnimationFrame(drawSnow);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    paused = true; cancelAnimationFrame(snowRaf); cancelAnimationFrame(cursorRaf); video.pause();
  } else {
    paused = false; snowRaf = requestAnimationFrame(drawSnow); cursorRaf = requestAnimationFrame(moveCursor);
    video.play().catch(() => {});
  }
});

window.addEventListener('pagehide', () => {
  cancelAnimationFrame(snowRaf); cancelAnimationFrame(cursorRaf);
  video.pause(); video.src = ''; ctx.clearRect(0, 0, cw, ch);
}, { once: true });
</script>
</body>
</html>
