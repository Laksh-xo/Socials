<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Laksh &lt;3</title>
<link rel="icon" type="image/jpeg" href="yumaki_match_pfp_2_2.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cyan: #c084fc;
    --pink: #a855f7;
    --bg: #08060f;
    --text: #f5f0ff;
    --muted: rgba(245,240,255,0.45);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh; width: 100vw; overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
  }

  @media (pointer: fine) {
    body { cursor: none; }
    #cur {
      position: fixed; width: 7px; height: 7px;
      background: var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 8px var(--cyan), 0 0 16px rgba(0,245,255,0.4);
    }
    #cur-r {
      position: fixed; width: 28px; height: 28px;
      border: 1px solid rgba(0,245,255,0.45); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: width .22s, height .22s, opacity .25s;
      opacity: .55;
    }
    #cur.h { width: 14px; height: 14px; }
    #cur-r.h { width: 48px; height: 48px; opacity: .2; }
  }
  @media (pointer: coarse) { #cur, #cur-r { display: none !important; } }

  #bg-video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; opacity: .38;
    filter: saturate(.6) brightness(.55) hue-rotate(260deg);
  }

  .bg-glow {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
  }
  .bg-glow-a {
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(168,85,247,.15) 0%, transparent 65%);
    top: 50%; left: 50%; transform: translate(-50%,-60%);
    animation: breatheA 6s ease-in-out infinite alternate;
  }
  .bg-glow-b {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(192,132,252,.07) 0%, transparent 70%);
    bottom: 0; left: 10%;
    animation: breatheB 8s ease-in-out 2s infinite alternate;
  }
  @keyframes breatheA { to { transform: translate(-50%,-55%) scale(1.12); } }
  @keyframes breatheB { to { transform: translateY(-30px) scale(1.1); } }

  .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; opacity: 0;
    animation: twinkle var(--d,3s) var(--del,0s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0; transform: scale(.5) rotate(0deg); }
    50%  { opacity: var(--op,.6); }
    100% { opacity: .1; transform: scale(1.2) rotate(20deg); }
  }

  #enter-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: #030208;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    transition: opacity .9s ease;
  }
  #enter-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(168,85,247,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,85,247,.05) 1px, transparent 1px);
    background-size: 70px 70px;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }
  #enter-overlay.gone     { display: none; }

  #enter-btn {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: none; border: none; cursor: pointer; padding: 36px 52px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s ease; z-index: 1;
  }
  #enter-btn::before {
    content: ''; position: absolute; inset: 0; border-radius: 12px;
    border: 1px solid rgba(168,85,247,.2);
    background: rgba(168,85,247,.04);
    transition: border-color .3s, background .3s;
  }
  #enter-btn:hover::before { border-color: rgba(168,85,247,.4); background: rgba(168,85,247,.08); }
  #enter-btn:hover { transform: scale(1.03); }
  #enter-btn:active { transform: scale(.97); }

  .e-avatar {
    width: 80px; height: 80px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 1.5px var(--pink), 0 0 24px rgba(168,85,247,.4);
  }
  .e-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .e-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem; color: #fff; letter-spacing: .12em;
  }
  .e-cta {
    padding: 9px 34px; background: transparent;
    color: var(--pink); border: 1px solid var(--pink);
    border-radius: 2px; font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
    position: relative; overflow: hidden;
    transition: color .25s; display: block;
  }
  .e-cta::after {
    content: ''; position: absolute; inset: 0;
    background: var(--pink); transform: translateX(-100%);
    transition: transform .28s ease; z-index: -1;
  }
  #enter-btn:hover .e-cta { color: #07050d; }
  #enter-btn:hover .e-cta::after { transform: translateX(0); }
  .e-dots { display: flex; gap: 5px; }
  .e-dots span {
    width: 4px; height: 4px; border-radius: 50%; background: var(--pink);
    animation: blink 1.4s ease-in-out infinite;
  }
  .e-dots span:nth-child(2) { animation-delay: .2s; }
  .e-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%,100% { opacity: .15; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1); box-shadow: 0 0 5px var(--pink); }
  }

  #main {
    position: relative; z-index: 10;
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    overflow: hidden;
    opacity: 0; transition: opacity 1s ease .3s;
  }
  #main.visible { opacity: 1; }

  .top-bar {
    width: 100%; display: flex; justify-content: center; align-items: center;
    padding: 28px 24px 0; flex-shrink: 0;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    border-radius: 100px; padding: 7px 18px;
    font-size: .6rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); backdrop-filter: blur(8px);
    transition: border-color .4s, color .4s;
  }
  .status-pill .s-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #747f8d;
    flex-shrink: 0; transition: background .4s;
  }
  .status-pill.online { border-color: rgba(59,165,92,.3); color: rgba(59,165,92,.9); }
  .status-pill.online .s-dot { background: #3ba55c; box-shadow: 0 0 6px rgba(59,165,92,.8); }
  .status-pill.idle   { border-color: rgba(250,168,26,.3); color: rgba(250,168,26,.9); }
  .status-pill.idle   .s-dot { background: #faa81a; box-shadow: 0 0 6px rgba(250,168,26,.8); }
  .status-pill.dnd    { border-color: rgba(237,66,69,.35); color: rgba(237,66,69,.9); }
  .status-pill.dnd    .s-dot { background: #ed4245; box-shadow: 0 0 6px rgba(237,66,69,.8); }

  .hero {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 20px; gap: 0;
  }

  .hero-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 18vw, 14rem);
    line-height: .92; color: var(--pink);
    letter-spacing: .02em;
    text-shadow: 0 0 60px rgba(168,85,247,.25), 0 0 120px rgba(168,85,247,.1);
    opacity: 0; transform: translateY(30px);
    transition: opacity .8s cubic-bezier(.22,1,.36,1) .5s, transform .8s cubic-bezier(.22,1,.36,1) .5s;
    user-select: none;
  }
  #main.visible .hero-name { opacity: 1; transform: translateY(0); }

  .hero-tagline {
    font-size: clamp(.68rem, 1.4vw, .88rem);
    color: var(--muted); font-style: italic;
    letter-spacing: .05em; margin-top: 20px; min-height: 1.4em;
  }
  .cursor-blink {
    display: inline-block; width: 2px; height: 1em;
    background: var(--pink); margin-left: 2px; vertical-align: middle;
    animation: cblink .9s step-end infinite;
  }
  @keyframes cblink { 0%,100%{opacity:1} 50%{opacity:0} }

  .activity-divider {
    width: 44px; height: 1px; margin: 16px 0;
    background: linear-gradient(90deg, transparent, rgba(192,132,252,.55), transparent);
  }

  /* ── Multi-activity hero strip ── */
  .hero-activity-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px;
  }
  .hero-activity {
    display: flex; align-items: center; gap: 10px;
    font-size: .68rem; color: var(--muted); letter-spacing: .06em;
    opacity: 0; transform: translateY(4px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .hero-activity.visible { opacity: 1; transform: translateY(0); }
  .act-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    flex-shrink: 0; transition: background .4s;
  }
  .act-dot.playing { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .act-dot.spotify { background: #1DB954; box-shadow: 0 0 8px rgba(29,185,84,.8); }
  .act-dot.dnd-d   { background: #ed4245; box-shadow: 0 0 6px rgba(237,66,69,.8); }

  /* ── Activity count badge ── */
  .act-count-badge {
    display: none; align-items: center; gap: 5px;
    font-size: .55rem; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(192,132,252,.5); margin-top: 2px;
  }
  .act-count-badge.show { display: flex; }
  .act-count-badge span { color: var(--cyan); font-size: .6rem; }

  .bottom-links {
    width: 100%; flex-shrink: 0;
    padding: 0 20px max(20px, env(safe-area-inset-bottom, 20px));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }

  .links-row {
    display: flex; gap: 8px; width: 100%; max-width: 900px;
    overflow-x: auto; justify-content: center;
    scrollbar-width: none; -ms-overflow-style: none; padding: 2px 0;
  }
  .links-row::-webkit-scrollbar { display: none; }

  .link-card {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 5px; padding: 14px 16px; border-radius: 10px;
    min-width: 110px; flex: 1; max-width: 140px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.025);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-decoration: none;
    transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
  }
  .link-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(192,132,252,.5), transparent);
    transform: scaleX(0); transition: transform .28s ease;
  }
  @media (pointer: fine) {
    .link-card { cursor: none; }
    .link-card:hover {
      border-color: rgba(168,85,247,.3); background: rgba(168,85,247,.06);
      transform: translateY(-4px); box-shadow: 0 10px 28px rgba(168,85,247,.09);
    }
    .link-card:hover::before { transform: scaleX(1); }
    .link-card:hover .lc-name { color: var(--pink); }
  }
  @media (pointer: coarse) {
    .link-card:active { background: rgba(168,85,247,.08); transform: scale(.97); }
  }
  .lc-icon { font-size: 1rem; line-height: 1; }
  .lc-name {
    font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(240,234,248,.85); transition: color .2s;
  }
  .lc-handle { font-size: .56rem; letter-spacing: .03em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .dc-card-wrap { position: relative; min-width: 110px; flex: 1; max-width: 140px; }
  .dc-dropdown {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: 300px; max-width: calc(100vw - 32px);
    border: 1px solid rgba(192,132,252,.18);
    border-radius: 10px;
    background: rgba(7,5,13,.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 12px; gap: 8px; z-index: 100;
    box-shadow: 0 -8px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(192,132,252,.07);
    display: none; flex-direction: column;
    max-height: 420px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(168,85,247,.25) transparent;
  }
  .dc-dropdown::-webkit-scrollbar { width: 3px; }
  .dc-dropdown::-webkit-scrollbar-track { background: transparent; }
  .dc-dropdown::-webkit-scrollbar-thumb { background: rgba(168,85,247,.3); border-radius: 2px; }
  .dc-dropdown::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: .35; border-radius: 10px 10px 0 0;
  }
  .dc-dropdown.open { display: flex; }

  /* ── Activity section header ── */
  .dcd-section-header {
    font-size: .5rem; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(192,132,252,.4); padding: 2px 0 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .dcd-section-header::after {
    content: ''; flex: 1; height: 1px; background: rgba(192,132,252,.1);
  }

  .dcd-track { display: flex; align-items: center; gap: 10px; }
  .dcd-art { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  .dcd-info { flex: 1; min-width: 0; }
  .dcd-song { font-size: .7rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dcd-artist { font-size: .6rem; color: var(--muted); margin-top: 2px; }
  .dcd-bar-wrap { height: 2px; background: rgba(255,255,255,.08); border-radius: 1px; overflow: hidden; margin-top: 6px; }
  .dcd-bar { height: 100%; background: #1DB954; border-radius: 1px; transition: width 1s linear; }
  .dcd-act { display: flex; align-items: center; gap: 10px; }
  .dcd-act-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,.04); flex-shrink: 0; }
  .dcd-act-name { font-size: .58rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .dcd-act-detail { font-size: .68rem; color: var(--text); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dcd-act-state { font-size: .6rem; color: var(--muted); margin-top: 1px; }
  .dcd-act-elapsed { font-size: .58rem; color: var(--cyan); margin-top: 3px; }
  .dcd-custom { display: flex; align-items: center; gap: 7px; font-size: .66rem; color: rgba(240,234,248,.5); font-style: italic; }
  .dcd-divider { height: 1px; background: rgba(192,132,252,.08); }

  @keyframes shimmer { 0%{background-position:-300px 0} 100%{background-position:300px 0} }
  .dcd-loading {
    height: 40px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(192,132,252,.02) 25%, rgba(192,132,252,.07) 50%, rgba(192,132,252,.02) 75%);
    background-size: 600px 100%; animation: shimmer 1.5s infinite;
  }

  .footer-txt {
    font-size: .5rem; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(240,234,248,.14); text-align: center;
  }

  /* ── Mute button ── */
  #mute-btn {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom, 24px));
    right: 24px;
    z-index: 200;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(192,132,252,.25);
    background: rgba(8,6,15,.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s, background .2s, transform .15s, opacity .3s;
    opacity: 0; pointer-events: none;
    -webkit-tap-highlight-color: transparent;
  }
  #mute-btn.show { opacity: 1; pointer-events: all; }
  #mute-btn svg { width: 16px; height: 16px; fill: none; stroke: rgba(192,132,252,.75); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
  @media (pointer: fine) {
    #mute-btn { cursor: none; }
    #mute-btn:hover { border-color: rgba(168,85,247,.55); background: rgba(168,85,247,.12); transform: scale(1.1); }
    #mute-btn:hover svg { stroke: var(--pink); }
  }
  @media (pointer: coarse) {
    #mute-btn:active { transform: scale(.93); background: rgba(168,85,247,.15); }
  }

  @media (max-width: 600px) {
    .hero-name { font-size: clamp(4rem, 22vw, 8rem); }
    .links-row { justify-content: flex-start; padding: 2px 2px; }
    .link-card, .dc-card-wrap { min-width: 96px; max-width: 120px; padding: 11px 12px; }
    .lc-name { font-size: .6rem; }
    .lc-handle { font-size: .52rem; }
    .hero-tagline { font-size: .65rem; }
    #mute-btn { bottom: max(18px, env(safe-area-inset-bottom, 18px)); right: 16px; }
  }
  @media (max-height: 680px) {
    .top-bar { padding-top: 14px; }
    .hero-name { font-size: clamp(3.5rem, 14vw, 7rem); }
    .bottom-links { padding-bottom: 14px; }
    .activity-divider { margin: 10px 0; }
  }
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-r"></div>
<video id="bg-video" loop playsinline src="bg.mp4"></video>
<div class="bg-glow bg-glow-a"></div>
<div class="bg-glow bg-glow-b"></div>
<div class="stars" id="stars"></div>

<!-- Mute / unmute button -->
<button id="mute-btn" aria-label="Mute audio">
  <svg id="icon-sound" viewBox="0 0 24 24">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
  </svg>
  <svg id="icon-mute" viewBox="0 0 24 24" style="display:none">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
</button>

<div id="enter-overlay">
  <button id="enter-btn" aria-label="Enter">
    <div class="e-avatar"><img src="yumaki_match_pfp_2_2.jpg" alt="Laksh"/></div>
    <span class="e-name">Laksh</span>
    <span class="e-cta">enter</span>
    <div class="e-dots"><span></span><span></span><span></span></div>
  </button>
</div>

<main id="main">

  <div class="top-bar">
    <div class="status-pill" id="status-pill">
      <span class="s-dot"></span>
      <span id="status-label">discord</span>
    </div>
  </div>

  <div class="hero">
    <h1 class="hero-name">laksh &lt;3</h1>
    <p class="hero-tagline" id="tagline"></p>
    <div class="activity-divider"></div>
    <!-- Multi-activity hero strip -->
    <div class="hero-activity-wrap" id="hero-activity-wrap">
      <div class="hero-activity" id="act-primary">
        <span class="act-dot" id="act-dot"></span>
        <span id="act-text">loading activity</span>
      </div>
      <!-- Additional activities rendered here dynamically -->
    </div>
    <div class="act-count-badge" id="act-count-badge">
      <span id="act-count-num"></span> activities running
    </div>
  </div>

  <div class="bottom-links">
    <div class="links-row">
      <a href="https://www.youtube.com/channel/UCYmXwWSLJvguHhP-nFo69Jg" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">▶</span>
        <span class="lc-name">YouTube</span>
        <span class="lc-handle">lakshxplayz</span>
      </a>
      <a href="https://www.twitch.tv/lakshxplayz" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">🎮</span>
        <span class="lc-name">Twitch</span>
        <span class="lc-handle">lakshxplayz</span>
      </a>
      <a href="https://www.instagram.com/lakshx.jpeg" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">📸</span>
        <span class="lc-name">Instagram</span>
        <span class="lc-handle">lakshx.jpeg</span>
      </a>
      <div class="dc-card-wrap">
        <div class="link-card" id="dc-toggle-card">
          <span class="lc-icon">
            <svg width="15" height="11" viewBox="0 0 24 18" fill="rgba(240,234,248,0.75)">
              <path d="M20.317 1.492a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 .677 1.492a.07.07 0 0 0-.032.027C-2.533 6.168-3.32 10.702-2.901 15.179a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.1.246.198.373.292a.077.077 0 0 1-.006.127c-.598.35-1.22.645-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
            </svg>
          </span>
          <span class="lc-name">Discord</span>
          <span class="lc-handle" id="dc-card-handle">tap for activity</span>
        </div>
        <div class="dc-dropdown" id="dc-dropdown">
          <div class="dcd-loading" id="dcd-content"></div>
        </div>
      </div>
      <a href="https://steamcommunity.com/id/lakshx" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">🎮</span>
        <span class="lc-name">Steam</span>
        <span class="lc-handle">lakshx</span>
      </a>
      <a href="https://www.roblox.com/users/5496495013/profile" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">🟥</span>
        <span class="lc-name">Roblox</span>
        <span class="lc-handle">lakshx</span>
      </a>
      <a href="https://www.snapchat.com/@lakshx.jpeg" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">👻</span>
        <span class="lc-name">Snapchat</span>
        <span class="lc-handle">lakshx.jpeg</span>
      </a>
      <a href="https://open.spotify.com/user/314rymteiostne2wjommzch2gmvm" target="_blank" rel="noopener noreferrer" class="link-card">
        <span class="lc-icon">🎵</span>
        <span class="lc-name">Spotify</span>
        <span class="lc-handle">lakshx</span>
      </a>
    </div>
    <p class="footer-txt">made with ♥ · laksh · 2025</p>
  </div>

</main>

<script>
(function(){
  'use strict';

  const overlay = document.getElementById('enter-overlay');
  const mainEl  = document.getElementById('main');
  const muteBtn = document.getElementById('mute-btn');
  const iconSound = document.getElementById('icon-sound');
  const iconMute  = document.getElementById('icon-mute');
  const video     = document.getElementById('bg-video');

  let isMuted = false;

  document.getElementById('enter-btn').addEventListener('click', () => {
    overlay.classList.add('fade-out');
    mainEl.classList.add('visible');
    setTimeout(() => overlay.classList.add('gone'), 1000);
    video.play().catch(err => console.warn('Autoplay blocked:', err));
    setTimeout(() => muteBtn.classList.add('show'), 600);
  });

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    isMuted = !isMuted;
    video.muted = isMuted;
    iconSound.style.display = isMuted ? 'none' : '';
    iconMute.style.display  = isMuted ? ''     : 'none';
    muteBtn.setAttribute('aria-label', isMuted ? 'Unmute audio' : 'Mute audio');
  });

  const cur  = document.getElementById('cur');
  const curR = document.getElementById('cur-r');
  if (window.matchMedia('(pointer:fine)').matches && cur) {
    let mx=-100, my=-100, rx=-100, ry=-100;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      cur.style.left=mx+'px'; cur.style.top=my+'px';
    });
    (function loop(){ rx+=(mx-rx)*.12; ry+=(my-ry)*.12; curR.style.left=rx+'px'; curR.style.top=ry+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('a,button,.link-card').forEach(el => {
      el.addEventListener('mouseenter',()=>{ cur.classList.add('h'); curR.classList.add('h'); });
      el.addEventListener('mouseleave',()=>{ cur.classList.remove('h'); curR.classList.remove('h'); });
    });
  }

  const starsEl = document.getElementById('stars');
  for (let i=0; i<26; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*3+2;
    const isPink = Math.random() > .45;
    s.style.cssText = [
      'width:'+sz+'px','height:'+sz+'px',
      'top:'+Math.random()*100+'%','left:'+Math.random()*100+'%',
      '--d:'+(2+Math.random()*5)+'s','--del:'+(Math.random()*6)+'s',
      '--op:'+(0.3+Math.random()*.5),
      'border-radius:'+(Math.random()>.5?'50%':'2px'),
      'background:'+(isPink?'var(--pink)':'var(--cyan)')
    ].join(';');
    starsEl.appendChild(s);
  }

  const LINES = [
    '18 · game developer · content creator',
    'grinding ranked like it\'s a job',
    'built different, coded different',
    '18 · discord mod · gamer · creator',
  ];
  let li=0, ci=0, del=false;
  const tEl = document.getElementById('tagline');
  function type(){
    const line=LINES[li];
    if (!del) {
      tEl.innerHTML=line.slice(0,ci+1)+'<span class="cursor-blink"></span>';
      ci++;
      if (ci>=line.length){ del=true; setTimeout(type,2000); return; }
    } else {
      tEl.innerHTML=line.slice(0,ci)+'<span class="cursor-blink"></span>';
      ci--;
      if (ci<0){ del=false; li=(li+1)%LINES.length; ci=0; setTimeout(type,380); return; }
    }
    setTimeout(type, del?38:60);
  }
  setTimeout(type,1300);

  const statusPill  = document.getElementById('status-pill');
  const statusLabel = document.getElementById('status-label');
  const actDot      = document.getElementById('act-dot');
  const actText     = document.getElementById('act-text');
  const dcdContent  = document.getElementById('dcd-content');
  const dcHandle    = document.getElementById('dc-card-handle');
  const heroWrap    = document.getElementById('hero-activity-wrap');
  const actCountBadge = document.getElementById('act-count-badge');
  const actCountNum   = document.getElementById('act-count-num');
  let spTimer = null;

  function setStatus(s) {
    const m={online:'online',idle:'idle',dnd:'do not disturb',offline:'offline'};
    statusPill.className='status-pill '+(s==='dnd'?'dnd':s==='idle'?'idle':s==='online'?'online':'');
    statusLabel.textContent='discord · '+(m[s]||s);
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtT(ms){ const s=Math.floor(ms/1e3),m=Math.floor(s/60),h=Math.floor(m/60); return h>0?h+'h '+(m%60)+'m':m>0?m+'m '+(s%60)+'s':s+'s'; }

  // ── Render hero multi-activity strip ──
  function renderHeroActivities(sp, others, status) {
    // Remove any previously added extra rows (keep #act-primary)
    heroWrap.querySelectorAll('.act-extra').forEach(el => el.remove());

    const allItems = [];

    if (sp) {
      allItems.push({ dotClass: 'act-dot spotify', text: sp.song + ' — ' + sp.artist });
    }
    others.forEach(act => {
      if (!act.name) return;
      allItems.push({
        dotClass: 'act-dot playing',
        text: act.name + (act.details ? ' · ' + act.details : '')
      });
    });

    if (allItems.length === 0) {
      if (status === 'offline') {
        actDot.className = 'act-dot';
        actText.textContent = 'not around right now';
      } else {
        actDot.className = 'act-dot' + (status === 'dnd' ? ' dnd-d' : '');
        actText.textContent = 'discord · ' + (status === 'dnd' ? 'do not disturb' : status);
      }
      actCountBadge.classList.remove('show');
    } else {
      // Primary (first item)
      actDot.className = allItems[0].dotClass;
      actText.textContent = allItems[0].text;

      // Additional items — rendered as stacked rows
      for (let i = 1; i < allItems.length; i++) {
        const row = document.createElement('div');
        row.className = 'hero-activity act-extra';
        const dot = document.createElement('span');
        dot.className = allItems[i].dotClass;
        const txt = document.createElement('span');
        txt.textContent = allItems[i].text;
        row.appendChild(dot);
        row.appendChild(txt);
        heroWrap.appendChild(row);
        // Stagger fade-in
        requestAnimationFrame(() => {
          setTimeout(() => row.classList.add('visible'), i * 80);
        });
      }

      // Badge if more than 1
      if (allItems.length > 1) {
        actCountNum.textContent = allItems.length;
        actCountBadge.classList.add('show');
      } else {
        actCountBadge.classList.remove('show');
      }
    }

    // Animate primary row in
    requestAnimationFrame(() => {
      document.getElementById('act-primary').classList.add('visible');
    });
  }

  // ── Render Discord card handle ──
  function renderDcHandle(sp, others) {
    const total = (sp ? 1 : 0) + others.length;
    if (total === 0) {
      dcHandle.textContent = 'tap for activity';
    } else if (total === 1) {
      dcHandle.textContent = sp ? 'listening now' : 'playing now';
    } else {
      dcHandle.textContent = total + ' activities';
    }
  }

  function renderAll(data) {
    if (spTimer){ clearInterval(spTimer); spTimer=null; }
    const status = data.discord_status || 'offline';
    setStatus(status);
    const acts   = data.activities || [];
    const sp     = data.spotify;
    const custom = acts.find(a => a.type === 4);
    const others = acts.filter(a => a.type !== 4 && a.type !== 2);

    renderHeroActivities(sp, others, status);
    renderDcHandle(sp, others);

    // ── Dropdown ──
    let html = '';

    if (custom && custom.state) {
      const em = custom.emoji
        ? (custom.emoji.id
          ? `<img src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.webp?size=20" style="width:14px;height:14px;vertical-align:middle;" alt="">`
          : custom.emoji.name)
        : '';
      html += `<div class="dcd-custom"><span>${em}</span><span>${esc(custom.state)}</span></div>`;
    }

    // Spotify section
    if (sp) {
      if (html) html += '<div class="dcd-divider"></div>';
      html += `<div class="dcd-section-header">spotify</div>`;
      const pct = (sp.timestamps.start && sp.timestamps.end)
        ? Math.min(100, ((Date.now() - sp.timestamps.start) / (sp.timestamps.end - sp.timestamps.start)) * 100)
        : 0;
      html += `<div class="dcd-track">
        <img class="dcd-art" src="${esc(sp.album_art_url||'')}" alt="" onerror="this.style.display='none'">
        <div class="dcd-info">
          <div class="dcd-song">${esc(sp.song)}</div>
          <div class="dcd-artist">${esc(sp.artist)}</div>
          <div class="dcd-bar-wrap"><div class="dcd-bar" id="dcd-sp-bar" style="width:${pct}%"></div></div>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      </div>`;
      if (sp.timestamps.start && sp.timestamps.end) {
        const tot = sp.timestamps.end - sp.timestamps.start;
        spTimer = setInterval(() => {
          const b = document.getElementById('dcd-sp-bar');
          if (!b){ clearInterval(spTimer); return; }
          b.style.width = Math.min(100, ((Date.now() - sp.timestamps.start) / tot) * 100) + '%';
        }, 1000);
      }
    }

    // All game/app activities — each gets its own section header
    if (others.length > 0) {
      if (html) html += '<div class="dcd-divider"></div>';
      if (others.length > 1) {
        html += `<div class="dcd-section-header">${others.length} activities</div>`;
      } else {
        html += `<div class="dcd-section-header">activity</div>`;
      }
      others.forEach((act, idx) => {
        if (!act.name) return;
        if (idx > 0) html += '<div class="dcd-divider"></div>';
        const li2 = act.assets?.large_image
          ? (act.assets.large_image.startsWith('mp:external/')
            ? 'https://media.discordapp.net/external/' + act.assets.large_image.slice(12)
            : `https://cdn.discordapp.com/app-assets/${act.application_id}/${act.assets.large_image}.webp`)
          : '';
        const el = act.timestamps?.start ? Date.now() - act.timestamps.start : null;
        html += `<div class="dcd-act">
          ${li2 ? `<img class="dcd-act-img" src="${esc(li2)}" alt="" onerror="this.style.display='none'">` : '<div class="dcd-act-img"></div>'}
          <div style="flex:1;min-width:0;">
            <div class="dcd-act-name">${esc(act.name)}</div>
            ${act.details ? `<div class="dcd-act-detail">${esc(act.details)}</div>` : ''}
            ${act.state   ? `<div class="dcd-act-state">${esc(act.state)}</div>`   : ''}
            ${el !== null ? `<div class="dcd-act-elapsed">▶ ${fmtT(el)} elapsed</div>` : ''}
          </div>
        </div>`;
      });
    }

    if (!html) html = '<p style="font-size:.64rem;color:var(--muted);text-align:center;padding:6px 0;">no activity right now</p>';
    dcdContent.innerHTML = html;
  }

  const dcToggle = document.getElementById('dc-toggle-card');
  const dcDrop   = document.getElementById('dc-dropdown');
  dcToggle.addEventListener('click', e => { e.stopPropagation(); dcDrop.classList.toggle('open'); });
  document.addEventListener('click', () => dcDrop.classList.remove('open'));

  const DISCORD_ID = '657910178577907713';
  function fetchL(){
    fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
      .then(r => r.json())
      .then(j => { if (j.success) renderAll(j.data); else { setStatus('offline'); actText.textContent='could not load'; }})
      .catch(() => { setStatus('offline'); actText.textContent='could not load'; });
  }
  fetchL();
  setInterval(fetchL, 30000);

  (function wsConnect(){
    const ws = new WebSocket('wss://api.lanyard.rest/socket');
    ws.onopen = () => ws.send(JSON.stringify({op:2, d:{subscribe_to_id: DISCORD_ID}}));
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.op === 1) setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({op:3})), m.d.heartbeat_interval);
      if (m.op === 0 && m.t === 'INIT_STATE')      renderAll(m.d);
      if (m.op === 0 && m.t === 'PRESENCE_UPDATE') renderAll(m.d);
    };
    ws.onclose = () => setTimeout(wsConnect, 5000);
  })();

})();
</script>
</body>
</html>
