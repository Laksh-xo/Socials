<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Laksh &lt;3!!</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: transparent;
    --surface: rgba(0, 0, 0, 0.55);
    --surface-hover: rgba(0, 0, 0, 0.75);
    --text: #fff;
    --sub: #aaa;
    --shadow: 0 2px 14px rgba(0,0,0,0.3);
    --shadow-hover: 0 8px 28px rgba(0,0,0,0.5);
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: transparent;
    color: var(--text);
    overflow-x: hidden;
    cursor: none;
  }

  /* Cursor - small black dot */
  .cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s, opacity 0.15s;
  }
  .cursor.hover { width: 20px; height: 20px; opacity: 0.4; }

  /* Video — ultra subtle under white wash */
  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    filter: brightness(1.0);
    transition: opacity 2s ease;
  }
  #bg-video.visible { opacity: 0.35; }

  .whitewash {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: transparent;
  }

  /* ENTER OVERLAY */
  #enter-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.9s ease;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }

  #enter-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: none;
    border: none;
    cursor: none;
    transition: transform 0.3s ease;
  }
  #enter-btn:hover { transform: scale(1.04); }

  .enter-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    overflow: hidden;
    background: #e0e0e0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .enter-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .enter-name {
    font-size: 1.15rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .enter-cta {
    padding: 9px 26px;
    background: #111;
    color: #fff;
    border-radius: 100px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.2s, transform 0.2s;
  }
  #enter-btn:hover .enter-cta { background: #333; }

  .enter-dots { display: flex; gap: 5px; }
  .enter-dots span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #bbb;
    animation: blink 1.4s ease-in-out infinite;
  }
  .enter-dots span:nth-child(2) { animation-delay: 0.2s; }
  .enter-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%       { opacity: 1; }
  }

  /* PAGE */
  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
  }

  /* Profile */
  .profile {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  .avatar {
    width: 86px; height: 86px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 14px;
    background: #ddd;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }
  .avatar-img  { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-emoji {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }

  .name {
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #fff;
    margin-bottom: 5px;
    animation: neonFlicker 4s infinite;
    text-shadow:
      0 0 5px #fff,
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 40px #fff,
      0 0 80px #fff;
  }

  .name::before, .name::after { content: none; }

  @keyframes neonFlicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #fff,
        0 0 80px #fff;
      opacity: 1;
    }
    20%, 24%, 55% {
      text-shadow: none;
      opacity: 0.4;
    }
  }

  .bio {
    font-size: 0.75rem;
    letter-spacing: 0.07em;
    color: #000;
    text-transform: uppercase;
  }

  /* LINKS — pill style */
  .links {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    background: var(--surface);
    border-radius: 100px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    animation: fadeUp 0.5s both;
  }
  .link-item:hover {
    background: var(--surface-hover);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px) scale(1.025);
  }

  .link-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    background: rgba(255,255,255,0.1);
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .link-item:hover .link-icon { transform: scale(1.12); }

  .link-title {
    flex: 1;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #fff;
  }

  .link-sub {
    font-size: 0.68rem;
    color: var(--sub);
  }

  .link-arrow {
    font-size: 13px;
    color: #bbb;
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.2s ease;
  }
  .link-item:hover .link-arrow { opacity: 1; transform: translateX(0); }

  .link-item:nth-child(1) { animation-delay: 0.10s; }
  .link-item:nth-child(2) { animation-delay: 0.17s; }
  .link-item:nth-child(3) { animation-delay: 0.24s; }
  .link-item:nth-child(4) { animation-delay: 0.31s; }
  .link-item:nth-child(5) { animation-delay: 0.38s; }
  .link-item:nth-child(6) { animation-delay: 0.45s; }
  .link-item:nth-child(7) { animation-delay: 0.52s; }
  .link-item:nth-child(8) { animation-delay: 0.59s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .page  { padding: 44px 16px 60px; }
    .links { max-width: 100%; }
  }

  @media (hover: none) {
    body { cursor: auto; }
    .cursor { display: none; }
    #enter-overlay { cursor: pointer; }
    #enter-btn { cursor: pointer; }
  }
</style>
</head>
<body>

<!-- ENTER OVERLAY -->
<div id="enter-overlay">
  <button id="enter-btn" aria-label="Enter site">
    <div class="enter-avatar">
      <img src="mygif.gif" alt="Laksh" onerror="this.style.display='none'"/>
    </div>
    <div class="enter-name">Laksh &lt;3!!</div>
    <div class="enter-cta">Enter ↗</div>
  </button>
  <div class="enter-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="cursor" id="cursor"></div>

<video id="bg-video" loop playsinline webkit-playsinline x5-playsinline src="bg.mp4"></video>
<div class="whitewash"></div>

<main class="page">
  <div class="profile">
    <div class="avatar" id="avatarEl">
      <span class="avatar-emoji">✦</span>
    </div>
    <h1 class="name" id="userName" data-text="Laksh &lt;3!!">Laksh &lt;3!!</h1>
    <p class="bio"  id="userBio">18 | Game Developer | Content Creator | Discord Moderation | Gamer</p>
  </div>

  <div class="links" id="linksContainer"></div>
</main>

<script>
// ═══════════════════════════════════
//  ✦ EDIT YOUR INFO HERE
// ═══════════════════════════════════
const CONFIG = {
  name:        "Laksh <3!!",
  bio:         "18 | Game Developer | Content Creator | Discord Moderation | Gamer",
  avatarEmoji: "✦",
  avatarImg:   "mygif.gif",
  links: [
    { icon: "▶",  title: "YouTube",   sub: "@laksh",        url: "https://www.youtube.com/channel/UCYmXwWSLJvguHhP-nFo69Jg" },
    { icon: "🎮", title: "Twitch",    sub: "lakshxplayz",   url: "https://www.twitch.tv/lakshxplayz" },
    { icon: "📸", title: "Instagram", sub: "@lakshx.jpeg",  url: "https://www.instagram.com/lakshx.jpeg" },
    { icon: "📸", title: "Instagram", sub: "@lakshx.playz", url: "https://www.instagram.com/lakshx.playz" },
    { icon: "🎮", title: "Steam",     sub: "lakshx",        url: "https://steamcommunity.com/id/lakshx" },
    { icon: "🎮", title: "Roblox",    sub: "lakshx",        url: "https://www.roblox.com/users/5496495013/profile" },
    { icon: "👻", title: "Snapchat",  sub: "@lakshx.jpeg",  url: "https://www.snapchat.com/@lakshx.jpeg" },
    { icon: "🎵", title: "Spotify",   sub: "lakshx",        url: "https://open.spotify.com/user/314rymteiostne2wjommzch2gmvm" },
  ]
};
// ═══════════════════════════════════

// Profile
document.getElementById('userName').textContent = CONFIG.name;
document.getElementById('userBio').textContent  = CONFIG.bio;
document.title = CONFIG.name + " | Links";

const avatarEl = document.getElementById('avatarEl');
if (CONFIG.avatarImg) {
  const img = document.createElement('img');
  img.src       = CONFIG.avatarImg;
  img.alt       = CONFIG.name;
  img.className = 'avatar-img';
  img.onerror   = () => { avatarEl.innerHTML = `<span class="avatar-emoji">${CONFIG.avatarEmoji}</span>`; };
  avatarEl.innerHTML = '';
  avatarEl.appendChild(img);
}

// Links — use fragment to avoid repeated reflows
const fragment = document.createDocumentFragment();
CONFIG.links.forEach(link => {
  const a = document.createElement('a');
  a.href      = link.url;
  a.target    = '_blank';
  a.rel       = 'noopener noreferrer';
  a.className = 'link-item';
  a.innerHTML = `
    <div class="link-icon">${link.icon}</div>
    <div class="link-title">${link.title}</div>
    <div class="link-sub">${link.sub}</div>
    <div class="link-arrow">→</div>
  `;
  fragment.appendChild(a);
});
document.getElementById('linksContainer').appendChild(fragment);

// Enter overlay
const overlay  = document.getElementById('enter-overlay');
const enterBtn = document.getElementById('enter-btn');
const video    = document.getElementById('bg-video');

function startExperience() {
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play(); });
  overlay.classList.add('fade-out');
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}
enterBtn.addEventListener('click', startExperience, { once: true });
enterBtn.addEventListener('touchend', e => { e.preventDefault(); startExperience(); }, { once: true });

// Cursor — throttled via RAF, single loop
const cursor = document.getElementById('cursor');
let mx = -100, my = -100, cursorRaf = null;

function moveCursor() {
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
  cursorRaf = requestAnimationFrame(moveCursor);
}

document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
cursorRaf = requestAnimationFrame(moveCursor);

// Use event delegation instead of per-element listeners
document.addEventListener('mouseover', e => {
  if (e.target.closest('a, button')) cursor.classList.add('hover');
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('a, button')) cursor.classList.remove('hover');
});

document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; });

// Video
video.addEventListener('canplay', () => video.classList.add('visible'), { once: true });

// Snowflakes — pause when tab hidden, cancel RAF on unload
const canvas = document.createElement('canvas');
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d', { alpha: true });

let cw = canvas.width  = window.innerWidth;
let ch = canvas.height = window.innerHeight;

// Debounced resize to avoid thrashing
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    cw = canvas.width  = window.innerWidth;
    ch = canvas.height = window.innerHeight;
  }, 150);
});

const flakes = Array.from({ length: 80 }, () => ({
  x: Math.random() * cw,
  y: Math.random() * ch,
  r: Math.random() * 3 + 1,
  speed: Math.random() * 1.2 + 0.4,
  wind: Math.random() * 0.6 - 0.3,
  opacity: Math.random() * 0.6 + 0.3,
}));

let snowRaf = null;
let paused  = false;

function drawSnow() {
  if (paused) return;
  ctx.clearRect(0, 0, cw, ch);
  for (let i = 0; i < flakes.length; i++) {
    const f = flakes[i];
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
    ctx.fill();
    f.y += f.speed;
    f.x += f.wind;
    if (f.y > ch) { f.y = -f.r; f.x = Math.random() * cw; }
    if (f.x > cw) { f.x = 0; }
    if (f.x < 0)  { f.x = cw; }
  }
  snowRaf = requestAnimationFrame(drawSnow);
}
snowRaf = requestAnimationFrame(drawSnow);

// Pause all loops when tab is hidden — huge RAM/CPU saver
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    paused = true;
    cancelAnimationFrame(snowRaf);
    cancelAnimationFrame(cursorRaf);
    video.pause();
  } else {
    paused = false;
    snowRaf   = requestAnimationFrame(drawSnow);
    cursorRaf = requestAnimationFrame(moveCursor);
    video.play().catch(() => {});
  }
});

// Full cleanup on page unload
window.addEventListener('pagehide', () => {
  cancelAnimationFrame(snowRaf);
  cancelAnimationFrame(cursorRaf);
  video.pause();
  video.src = '';
  ctx.clearRect(0, 0, cw, ch);
}, { once: true });

</script>
</body>
</html>
