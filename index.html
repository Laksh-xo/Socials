<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Laksh &lt;3!!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96f;
    --cream: #f5ede0;
    --dark: #0a0806;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(201,168,76,0.25);
    --text: #f0e6d3;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'DM Mono', monospace;
    background: var(--dark);
    color: var(--text);
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    position: fixed;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid var(--gold-light);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, opacity 0.3s;
    opacity: 0.5;
  }
  .cursor.hover      { width: 20px; height: 20px; }
  .cursor-ring.hover { width: 60px; height: 60px; opacity: 0.2; }

  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    filter: saturate(0.6) brightness(0.5);
    transition: opacity 1.5s ease;
  }
  #bg-video.visible { opacity: 0.35; }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }

  /* ENTER OVERLAY */
  #enter-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.9s ease;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }

  #enter-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: none;
    border: none;
    cursor: none;
    transition: transform 0.3s ease;
  }
  #enter-btn:hover { transform: scale(1.04); }

  .enter-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    overflow: hidden;
    background: #1a1208;
    box-shadow: 0 0 0 2px var(--gold);
  }
  .enter-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .enter-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .enter-cta {
    padding: 9px 28px;
    background: var(--gold);
    color: #0a0806;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  #enter-btn:hover .enter-cta { background: var(--gold-light); }

  .enter-dots { display: flex; gap: 5px; }
  .enter-dots span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold);
    animation: blink 1.4s ease-in-out infinite;
  }
  .enter-dots span:nth-child(2) { animation-delay: 0.2s; }
  .enter-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%       { opacity: 1; }
  }

  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px 80px;
  }

  .profile {
    text-align: center;
    margin-bottom: 44px;
    animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), transparent, var(--gold-light), transparent, var(--gold));
    animation: spin 6s linear infinite;
    z-index: -1;
  }
  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a1f10, #1a1208);
    border: 2px solid var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    position: relative;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-emoji { line-height: 1; }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--cream), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    animation: neonFlicker 4s infinite;
  }

  @keyframes neonFlicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.4; }
  }

  .bio {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: rgba(240,230,211,0.55);
    text-transform: uppercase;
    max-width: 340px;
    margin: 0 auto;
    line-height: 1.8;
  }

  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 28px auto;
    animation: fadeUp 1s 0.2s both;
  }

  .links {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.7s both;
  }
  .link-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--gold), var(--gold-light));
    transform: scaleY(0);
    transition: transform 0.3s ease;
    border-radius: 0 2px 2px 0;
  }
  .link-item:hover {
    transform: translateX(6px) translateY(-2px);
    border-color: rgba(201,168,76,0.6);
    background: rgba(201,168,76,0.08);
    box-shadow: 0 8px 32px rgba(201,168,76,0.12), 0 2px 8px rgba(0,0,0,0.4);
  }
  .link-item:hover::before { transform: scaleY(1); }

  .link-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.3s ease;
  }
  .link-item:hover .link-icon { transform: rotate(-5deg) scale(1.1); }

  .link-info { flex: 1; min-width: 0; }
  .link-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-sub {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(240,230,211,0.4);
    margin-top: 2px;
  }

  .link-arrow {
    color: var(--gold);
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.3s ease;
    font-size: 18px;
  }
  .link-item:hover .link-arrow { opacity: 1; transform: translateX(0); }

  .link-item:nth-child(1) { animation-delay: 0.10s; }
  .link-item:nth-child(2) { animation-delay: 0.17s; }
  .link-item:nth-child(3) { animation-delay: 0.24s; }
  .link-item:nth-child(4) { animation-delay: 0.31s; }
  .link-item:nth-child(5) { animation-delay: 0.38s; }
  .link-item:nth-child(6) { animation-delay: 0.45s; }
  .link-item:nth-child(7) { animation-delay: 0.52s; }
  .link-item:nth-child(8) { animation-delay: 0.59s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 480px) {
    .page { padding: 40px 16px 60px; }
    .links { max-width: 100%; }
  }

  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none; }
    #enter-overlay { cursor: pointer; }
    #enter-btn { cursor: pointer; }
  }
</style>
</head>
<body>

<!-- ENTER OVERLAY -->
<div id="enter-overlay">
  <button id="enter-btn" aria-label="Enter site">
    <div class="enter-avatar">
      <img src="mygif.gif" alt="Laksh" onerror="this.style.display='none'"/>
    </div>
    <div class="enter-name">Laksh &lt;3!!</div>
    <div class="enter-cta">Enter ↗</div>
  </button>
  <div class="enter-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<video id="bg-video" loop playsinline webkit-playsinline src="bg.mp4"></video>

<div class="grain"></div>
<div class="vignette"></div>

<main class="page">
  <div class="profile">
    <div class="avatar-wrap">
      <div class="avatar" id="avatarEl">
        <span class="avatar-emoji">✦</span>
      </div>
    </div>
    <h1 class="name" id="userName">Laksh &lt;3!!</h1>
    <p class="bio" id="userBio">18 | Game Developer | Content Creator | Discord Moderation | Gamer</p>
  </div>

  <div class="divider"></div>
  <div class="links" id="linksContainer"></div>
</main>

<script>
const CONFIG = {
  name:        "Laksh <3!!",
  bio:         "18 | Game Developer | Content Creator | Discord Moderation | Gamer",
  avatarEmoji: "✦",
  avatarImg:   "mygif.gif",
  links: [
    { icon: "▶",  title: "YouTube",   sub: "@laksh",        url: "https://www.youtube.com/channel/UCYmXwWSLJvguHhP-nFo69Jg" },
    { icon: "🎮", title: "Twitch",    sub: "lakshxplayz",   url: "https://www.twitch.tv/lakshxplayz" },
    { icon: "📸", title: "Instagram", sub: "@lakshx.jpeg",  url: "https://www.instagram.com/lakshx.jpeg" },
    { icon: "📸", title: "Instagram", sub: "@lakshx.playz", url: "https://www.instagram.com/lakshx.playz" },
    { icon: "🎮", title: "Steam",     sub: "lakshx",        url: "https://steamcommunity.com/id/lakshx" },
    { icon: "🎮", title: "Roblox",    sub: "lakshx",        url: "https://www.roblox.com/users/5496495013/profile" },
    { icon: "👻", title: "Snapchat",  sub: "@lakshx.jpeg",  url: "https://www.snapchat.com/@lakshx.jpeg" },
    { icon: "🎵", title: "Spotify",   sub: "lakshx",        url: "https://open.spotify.com/user/314rymteiostne2wjommzch2gmvm" },
  ]
};

document.getElementById('userName').textContent = CONFIG.name;
document.getElementById('userBio').textContent  = CONFIG.bio;
document.title = CONFIG.name + " | Links";

const avatarEl = document.getElementById('avatarEl');
if (CONFIG.avatarImg) {
  const img = document.createElement('img');
  img.src     = CONFIG.avatarImg;
  img.alt     = CONFIG.name;
  img.onerror = () => { avatarEl.innerHTML = `<span class="avatar-emoji">${CONFIG.avatarEmoji}</span>`; };
  avatarEl.innerHTML = '';
  avatarEl.appendChild(img);
}

const fragment = document.createDocumentFragment();
CONFIG.links.forEach(link => {
  const a = document.createElement('a');
  a.href      = link.url;
  a.target    = '_blank';
  a.rel       = 'noopener noreferrer';
  a.className = 'link-item';
  a.innerHTML = `
    <div class="link-icon">${link.icon}</div>
    <div class="link-info">
      <div class="link-title">${link.title}</div>
      <div class="link-sub">${link.sub}</div>
    </div>
    <div class="link-arrow">→</div>
  `;
  fragment.appendChild(a);
});
document.getElementById('linksContainer').appendChild(fragment);

// Enter overlay
const overlay  = document.getElementById('enter-overlay');
const enterBtn = document.getElementById('enter-btn');
const video    = document.getElementById('bg-video');

function startExperience() {
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play(); });
  overlay.classList.add('fade-out');
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}
enterBtn.addEventListener('click', startExperience, { once: true });
enterBtn.addEventListener('touchend', e => { e.preventDefault(); startExperience(); }, { once: true });

// Cursor
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursorRing');
let mx = -100, my = -100, rx = -100, ry = -100, cursorRaf;

function moveCursor() {
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  cursorRaf = requestAnimationFrame(moveCursor);
}
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
cursorRaf = requestAnimationFrame(moveCursor);

document.addEventListener('mouseover', e => {
  if (e.target.closest('a, button')) { cursor.classList.add('hover'); ring.classList.add('hover'); }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('a, button')) { cursor.classList.remove('hover'); ring.classList.remove('hover'); }
});
document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; ring.style.opacity = '0'; });
document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; ring.style.opacity = ''; });

video.addEventListener('canplay', () => video.classList.add('visible'), { once: true });

// Snowflakes
const canvas = document.createElement('canvas');
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d', { alpha: true });
let cw = canvas.width = window.innerWidth;
let ch = canvas.height = window.innerHeight;

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }, 150);
});

const flakes = Array.from({ length: 80 }, () => ({
  x: Math.random() * cw, y: Math.random() * ch,
  r: Math.random() * 3 + 1,
  speed: Math.random() * 1.2 + 0.4,
  wind: Math.random() * 0.6 - 0.3,
  opacity: Math.random() * 0.6 + 0.3,
}));

let snowRaf, paused = false;

function drawSnow() {
  if (paused) return;
  ctx.clearRect(0, 0, cw, ch);
  for (let i = 0; i < flakes.length; i++) {
    const f = flakes[i];
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
    ctx.fill();
    f.y += f.speed; f.x += f.wind;
    if (f.y > ch) { f.y = -f.r; f.x = Math.random() * cw; }
    if (f.x > cw) f.x = 0;
    if (f.x < 0)  f.x = cw;
  }
  snowRaf = requestAnimationFrame(drawSnow);
}
snowRaf = requestAnimationFrame(drawSnow);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    paused = true;
    cancelAnimationFrame(snowRaf);
    cancelAnimationFrame(cursorRaf);
    video.pause();
  } else {
    paused = false;
    snowRaf   = requestAnimationFrame(drawSnow);
    cursorRaf = requestAnimationFrame(moveCursor);
    video.play().catch(() => {});
  }
});

window.addEventListener('pagehide', () => {
  cancelAnimationFrame(snowRaf);
  cancelAnimationFrame(cursorRaf);
  video.pause(); video.src = '';
  ctx.clearRect(0, 0, cw, ch);
}, { once: true });
</script>
</body>
</html>
