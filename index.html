<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Laksh &lt;3!!</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: rgba(212, 175, 55, 0.75);
    --surface: rgba(255,255,255,0.75);
    --surface-hover: rgba(255,255,255,0.95);
    --text: #111;
    --sub: #999;
    --shadow: 0 2px 14px rgba(0,0,0,0.07);
    --shadow-hover: 0 8px 28px rgba(0,0,0,0.12);
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    cursor: none;
  }

  /* Cursor - small black dot */
  .cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s, opacity 0.15s;
  }
  .cursor.hover { width: 20px; height: 20px; opacity: 0.4; }

  /* Video — ultra subtle under white wash */
  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    filter: saturate(0) brightness(1.2);
    transition: opacity 2s ease;
  }
  #bg-video.visible { opacity: 0.06; }

  .whitewash {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: rgba(212, 175, 55, 0.18);
  }

  /* ENTER OVERLAY */
  #enter-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.9s ease;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }

  #enter-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: none;
    border: none;
    cursor: none;
    transition: transform 0.3s ease;
  }
  #enter-btn:hover { transform: scale(1.04); }

  .enter-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    overflow: hidden;
    background: #e0e0e0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .enter-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .enter-name {
    font-size: 1.15rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .enter-cta {
    padding: 9px 26px;
    background: #111;
    color: #fff;
    border-radius: 100px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.2s, transform 0.2s;
  }
  #enter-btn:hover .enter-cta { background: #333; }

  .enter-dots { display: flex; gap: 5px; }
  .enter-dots span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #bbb;
    animation: blink 1.4s ease-in-out infinite;
  }
  .enter-dots span:nth-child(2) { animation-delay: 0.2s; }
  .enter-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%       { opacity: 1; }
  }

  /* PAGE */
  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
  }

  /* Profile */
  .profile {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  .avatar {
    width: 86px; height: 86px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 14px;
    background: #ddd;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }
  .avatar-img  { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-emoji {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }

  .name {
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #111;
    margin-bottom: 5px;
  }

  .bio {
    font-size: 0.75rem;
    letter-spacing: 0.07em;
    color: var(--sub);
    text-transform: uppercase;
  }

  /* LINKS — pill style */
  .links {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 100px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    animation: fadeUp 0.5s both;
  }
  .link-item:hover {
    background: var(--surface-hover);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px) scale(1.025);
  }

  .link-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    background: #efefed;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .link-item:hover .link-icon { transform: scale(1.12); }

  .link-title {
    flex: 1;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #111;
  }

  .link-sub {
    font-size: 0.68rem;
    color: var(--sub);
  }

  .link-arrow {
    font-size: 13px;
    color: #bbb;
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.2s ease;
  }
  .link-item:hover .link-arrow { opacity: 1; transform: translateX(0); }

  .link-item:nth-child(1) { animation-delay: 0.10s; }
  .link-item:nth-child(2) { animation-delay: 0.17s; }
  .link-item:nth-child(3) { animation-delay: 0.24s; }
  .link-item:nth-child(4) { animation-delay: 0.31s; }
  .link-item:nth-child(5) { animation-delay: 0.38s; }
  .link-item:nth-child(6) { animation-delay: 0.45s; }
  .link-item:nth-child(7) { animation-delay: 0.52s; }
  .link-item:nth-child(8) { animation-delay: 0.59s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .page  { padding: 44px 16px 60px; }
    .links { max-width: 100%; }
  }

  @media (hover: none) {
    body { cursor: auto; }
    .cursor { display: none; }
    #enter-overlay { cursor: pointer; }
    #enter-btn { cursor: pointer; }
  }
</style>
</head>
<body>

<!-- ENTER OVERLAY -->
<div id="enter-overlay">
  <button id="enter-btn" aria-label="Enter site">
    <div class="enter-avatar">
      <img src="mygif.gif" alt="Laksh" onerror="this.style.display='none'"/>
    </div>
    <div class="enter-name">Laksh &lt;3!!</div>
    <div class="enter-cta">Enter ↗</div>
  </button>
  <div class="enter-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="cursor" id="cursor"></div>

<video id="bg-video" loop playsinline webkit-playsinline x5-playsinline src="bg.mp4"></video>
<div class="whitewash"></div>

<main class="page">
  <div class="profile">
    <div class="avatar" id="avatarEl">
      <span class="avatar-emoji">✦</span>
    </div>
    <h1 class="name" id="userName">Laksh &lt;3!!</h1>
    <p class="bio"  id="userBio">Creator · Designer · Dreamer</p>
  </div>

  <div class="links" id="linksContainer"></div>
</main>

<script>
// ═══════════════════════════════════
//  ✦ EDIT YOUR INFO HERE
// ═══════════════════════════════════
const CONFIG = {
  name:        "Laksh <3!!",
  bio:         "Creator · Designer · Dreamer",
  avatarEmoji: "✦",
  avatarImg:   "mygif.gif",
  links: [
    { icon: "▶",  title: "YouTube",   sub: "@laksh",        url: "https://www.youtube.com/channel/UCYmXwWSLJvguHhP-nFo69Jg" },
    { icon: "🎮", title: "Twitch",    sub: "lakshxplayz",   url: "https://www.twitch.tv/lakshxplayz" },
    { icon: "📸", title: "Instagram", sub: "@lakshx.jpeg",  url: "https://www.instagram.com/lakshx.jpeg" },
    { icon: "📸", title: "Instagram", sub: "@lakshx.playz", url: "https://www.instagram.com/lakshx.playz" },
    { icon: "🎮", title: "Steam",     sub: "lakshx",        url: "https://steamcommunity.com/id/lakshx" },
    { icon: "🎮", title: "Roblox",    sub: "lakshx",        url: "https://www.roblox.com/users/5496495013/profile" },
    { icon: "👻", title: "Snapchat",  sub: "@lakshx.jpeg",  url: "https://www.snapchat.com/@lakshx.jpeg" },
    { icon: "🎵", title: "Spotify",   sub: "lakshx",        url: "https://open.spotify.com/user/314rymteiostne2wjommzch2gmvm" },
  ]
};
// ═══════════════════════════════════

// Profile
document.getElementById('userName').textContent = CONFIG.name;
document.getElementById('userBio').textContent  = CONFIG.bio;
document.title = CONFIG.name + " | Links";

const avatarEl = document.getElementById('avatarEl');
if (CONFIG.avatarImg) {
  const img = document.createElement('img');
  img.src       = CONFIG.avatarImg;
  img.alt       = CONFIG.name;
  img.className = 'avatar-img';
  img.onerror   = () => { avatarEl.innerHTML = `<span class="avatar-emoji">${CONFIG.avatarEmoji}</span>`; };
  avatarEl.innerHTML = '';
  avatarEl.appendChild(img);
}

// Links
const container = document.getElementById('linksContainer');
CONFIG.links.forEach(link => {
  const a = document.createElement('a');
  a.href      = link.url;
  a.target    = '_blank';
  a.rel       = 'noopener noreferrer';
  a.className = 'link-item';
  a.innerHTML = `
    <div class="link-icon">${link.icon}</div>
    <div class="link-title">${link.title}</div>
    <div class="link-sub">${link.sub}</div>
    <div class="link-arrow">→</div>
  `;
  container.appendChild(a);
});

// Enter overlay
const overlay  = document.getElementById('enter-overlay');
const enterBtn = document.getElementById('enter-btn');
const video    = document.getElementById('bg-video');

function startExperience() {
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play(); });
  overlay.classList.add('fade-out');
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}
enterBtn.addEventListener('click', startExperience);
enterBtn.addEventListener('touchend', e => { e.preventDefault(); startExperience(); });

// Cursor
const cursor = document.getElementById('cursor');
let mx = -100, my = -100;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function loop() {
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
  requestAnimationFrame(loop);
})();
document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
});

document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; });

// Video
video.addEventListener('canplay', () => video.classList.add('visible'), { once: true });
</script>
</body>
</html>
